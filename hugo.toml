baseURL = "https://darkwebhunter99.github.io/secshrimp-blog/"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
title = "SecShrimp Blog | 网络安全知识分享"
theme = "PaperMod"
[pagination]
  pagerSize = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[params]
  env = "production"
  title = "SecShrimp Blog"
  description = "专业网络安全知识分享 — 渗透测试、漏洞分析、安全运营、红队技术、AI安全"
  keywords = ["网络安全", "渗透测试", "漏洞分析", "安全运营", "红队", "AI安全", "供应链安全", "代码审计"]
  author = "SecShrimp"
  defaultTheme = "dark"
  ShowReadingTime = true
  DateFormat = "2006-01-02"
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = true
  disableScrollToTop = true
  hidemeta = false
  hideSummary = true
  showtoc = true
  tocopen = true

  [params.homeInfoParams]
    Title = "SecShrimp Security Research"
    Content = "专注网络安全技术研究与知识分享 — 渗透测试、漏洞分析、安全运营、红队技术、AI安全。实战经验，干货输出。"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/DarkWebHunter99"

  [params.editPost]
    URL = ""
    Text = "Suggest Changes"
    appendFilePath = true

  [params.assets]
    disableHLJS = false
    favicon = "favicon.ico"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"
    safari_pinned_tab = "safari-pinned-tab.svg"
    theme_color = "#0d1117"
    msapplication_TileColor = "#0d1117"

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "dracula"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "categories"
    name = "分类"
    url = "/categories/"
    weight = 2
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 3
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 4
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 5
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 6

[outputs]
  home = ["HTML", "RSS", "JSON"]

[taxonomies]
  category = "categories"
  tag = "tags"
