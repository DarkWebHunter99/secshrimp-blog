{{- /* SecShrimp Theme - Footer Extensions */ -}}

<script>
(function() {
    // Scroll reveal for post entries
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.style.opacity = '1';
                entry.target.style.transform = 'translateY(0)';
            }
        });
    }, { threshold: 0.1 });

    document.querySelectorAll('.post-entry, .first-entry').forEach(el => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(20px)';
        el.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
        observer.observe(el);
    });

    // Navbar scroll effect
    const nav = document.querySelector('.nav');
    if (nav) {
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                nav.style.background = 'rgba(15, 17, 23, 0.95)';
                nav.style.boxShadow = '0 1px 8px rgba(0,0,0,0.3)';
            } else {
                nav.style.background = 'rgba(15, 17, 23, 0.9)';
                nav.style.boxShadow = 'none';
            }
        });
    }
})();
</script>
