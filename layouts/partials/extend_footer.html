{{- /* SecShrimp Theme - Footer Extensions */ -}}

<script>
(function() {
    // ===== Scroll Reveal =====
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.style.opacity = '1';
                entry.target.style.transform = 'translateY(0)';
            }
        });
    }, { threshold: 0.1 });

    document.querySelectorAll('.post-entry, .first-entry').forEach(el => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(20px)';
        el.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
        observer.observe(el);
    });

    // ===== Navbar Scroll Effect =====
    const nav = document.querySelector('.nav');
    if (nav) {
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                nav.style.background = 'rgba(15, 17, 23, 0.95)';
                nav.style.boxShadow = '0 1px 8px rgba(0,0,0,0.3)';
            } else {
                nav.style.background = 'rgba(15, 17, 23, 0.9)';
                nav.style.boxShadow = 'none';
            }
        });
    }

    // ===== Difficulty Badges + Reading Time on Post Cards =====
    var postMeta = {
        'sql-injection-waf-bypass': { difficulty: 'intermediate', time: '12 min', label: '中级' },
        'ssrf-to-rce-attack-chain': { difficulty: 'intermediate', time: '15 min', label: '中级' },
        '2026-05-cve-critical-alert': { difficulty: 'beginner', time: '10 min', label: '入门' },
        'mcp-server-injection-attack': { difficulty: 'advanced', time: '14 min', label: '高级' },
        'red-team-shellcode-evasion': { difficulty: 'advanced', time: '18 min', label: '高级' },
        'supply-chain-attack-2026': { difficulty: 'intermediate', time: '16 min', label: '中级' },
        'openclaw-cve-security-analysis': { difficulty: 'advanced', time: '15 min', label: '高级' }
    };

    var diffColors = {
        beginner: { bg: 'rgba(52,211,153,0.12)', color: '#34d399', border: 'rgba(52,211,153,0.3)' },
        intermediate: { bg: 'rgba(245,158,11,0.12)', color: '#f59e0b', border: 'rgba(245,158,11,0.3)' },
        advanced: { bg: 'rgba(239,68,68,0.12)', color: '#ef4444', border: 'rgba(239,68,68,0.3)' }
    };

    document.querySelectorAll('.post-entry, .first-entry').forEach(function(card) {
        var link = card.querySelector('a[href*="/posts/"]');
        if (!link) return;
        var href = link.getAttribute('href') || '';
        var slug = '';
        var parts = href.split('/');
        for (var i = parts.length - 1; i >= 0; i--) {
            if (parts[i] && parts[i] !== '') { slug = parts[i].replace(/\/$/, ''); break; }
        }
        var meta = postMeta[slug];
        if (!meta) return;

        // Add difficulty badge
        var colors = diffColors[meta.difficulty] || diffColors.intermediate;
        var badge = document.createElement('span');
        badge.textContent = meta.label;
        badge.style.cssText = 'display:inline-block;font-size:0.65rem;font-weight:600;padding:1px 6px;border-radius:3px;margin-left:8px;vertical-align:middle;background:' + colors.bg + ';color:' + colors.color + ';border:1px solid ' + colors.border + ';letter-spacing:0.3px;text-transform:uppercase;';
        var footer = card.querySelector('.entry-footer');
        if (footer) footer.appendChild(badge);

        // Add reading time
        var timeSpan = document.createElement('span');
        timeSpan.textContent = '📖 ' + meta.time;
        timeSpan.style.cssText = 'display:inline-block;font-size:0.75rem;color:#8b949e;margin-left:8px;';
        if (footer) footer.appendChild(timeSpan);
    });

    // ===== Code Block Copy Button Enhancement =====
    document.querySelectorAll('pre').forEach(function(pre) {
        pre.style.position = 'relative';
    });

    // ===== Smooth Anchor Scrolling =====
    document.querySelectorAll('a[href^="#"]').forEach(function(a) {
        a.addEventListener('click', function(e) {
            var target = document.querySelector(this.getAttribute('href'));
            if (target) {
                e.preventDefault();
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        });
    });

    // ===== Table of Contents Active State =====
    var tocLinks = document.querySelectorAll('#TableOfContents a');
    if (tocLinks.length > 0) {
        var headings = [];
        tocLinks.forEach(function(link) {
            var id = link.getAttribute('href')?.substring(1);
            if (id) {
                var el = document.getElementById(id);
                if (el) headings.push({ el: el, link: link });
            }
        });
        if (headings.length > 0) {
            window.addEventListener('scroll', function() {
                var scrollPos = window.scrollY + 100;
                var active = headings[0];
                for (var i = 0; i < headings.length; i++) {
                    if (headings[i].el.offsetTop <= scrollPos) active = headings[i];
                }
                tocLinks.forEach(function(l) { l.style.color = ''; l.style.fontWeight = ''; });
                if (active) {
                    active.link.style.color = '#22d3ee';
                    active.link.style.fontWeight = '500';
                }
            });
        }
    }
})();
</script>
